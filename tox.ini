[tox]
requires =
    tox>=4
    tox-uv>=1
envlist = py312

[gh-actions]
python =
    3.12: py312

[testenv]
runner = uv-venv-lock-runner
description = run tests
dependency_groups = dev
uv_python_preference = only-managed
commands =
    pytest --doctest-modules tests --cov --cov-config=pyproject.toml --cov-report=xml
    mypy
